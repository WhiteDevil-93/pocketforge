apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.whitedevil93.pocketforge"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion = rootProject.ext.ndkVersion
    defaultConfig {
        applicationId "com.whitedevil93.pocketforge"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // Galaxy S25 Ultra only — skip other ABIs entirely to keep build time sane.
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // Same flags as upstream llama.cpp examples/llama.android.
                arguments "-DCMAKE_BUILD_TYPE=Release"
                arguments "-DCMAKE_MESSAGE_LOG_LEVEL=DEBUG"
                arguments "-DCMAKE_VERBOSE_MAKEFILE=ON"

                arguments "-DBUILD_SHARED_LIBS=ON"
                arguments "-DLLAMA_BUILD_APP=OFF"
                arguments "-DLLAMA_BUILD_COMMON=ON"
                arguments "-DLLAMA_OPENSSL=OFF"

                arguments "-DGGML_NATIVE=OFF"
                arguments "-DGGML_LLAMAFILE=OFF"

                // GGML_BACKEND_DL / GGML_CPU_ALL_VARIANTS must stay OFF on Android.
                // They build each backend as a CMake MODULE (dlopen-only, never
                // linked into libggml.so) and suppress the GGML_USE_CPU define, so
                // ggml's registry constructor skips ggml_backend_cpu_reg() and starts
                // EMPTY. Registering then depends on ggml_backend_load_all(), which
                // searches get_executable_path() — /system/bin under the zygote, not
                // the APK's lib/arm64 dir — so it finds nothing and every model load
                // fails. Off, the CPU backend is target_link_libraries'd into ggml
                // and statically registered, which is what pokekit-llm.cpp assumes.
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.31.6"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
