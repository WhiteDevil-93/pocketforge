name: Build Android APK

# Manual only. The Pages deploy in deploy.yml runs on push to main and must not be
# affected by Android builds — keeping this on workflow_dispatch keeps the two apart.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle build type'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # llama.cpp is vendored as a git submodule (third_party/llama.cpp)
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # setup-android@v3 does NOT install NDK/CMake by default; the native
      # build (llama.cpp) needs them explicitly.
      - name: Install NDK and CMake
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build web assets and sync to Android
        run: npm run build:android

      - name: Build APK
        working-directory: android
        run: ./gradlew assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }} --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketforge-${{ inputs.build_type || 'debug' }}-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
